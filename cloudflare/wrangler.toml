# Crunch on Cloudflare Workers: the website and admin (static assets), the X2008 ADMS relay
# (/iclock/*) and the server APIs (/api/*, /sitemap.xml) in one Worker.
# No route or custom domain is configured here: `wrangler deploy` only creates
# crunch-site.<account-subdomain>.workers.dev. Attaching www.crunnchhfitness.com is a separate,
# explicitly approved cut-over step (see REAL_DEVICE_CUTOVER_RUNBOOK.md).
name = "crunch-site"
# The Crunch Cloudflare account (not a secret): a deploy can never go to another account
account_id = "da6f102c1f0f6055bf42c52cfe5744aa"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# The production relay imports firebase-admin; on Workers it gets the REST stand-ins instead
# The website: the Vite build, served as static assets (free and unlimited on the Free plan —
# they never count as Worker requests). Unknown paths fall back to index.html (SPA routing).
# Only these paths run the Worker code (and count toward the 100,000/day Worker requests):
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/iclock/*", "/api/*", "/sitemap.xml", "/poc/*"]

# Workers Logs (free: 200,000 events/day, 3 days): the relay writes ~26K request lines/day
[observability]
enabled = true

[alias]
"firebase-admin/firestore" = "./src/firestore-rest.ts"
"firebase-admin/app" = "./src/admin-app.ts"
"firebase-admin/auth" = "./src/admin-auth.ts"

[vars]
# The old attendance server. Set to "none" to have the CRM answer the X2008 itself (tested) — only
# once old members are linked in the CRM and the CRM can block expired members on the device.
ADMS_UPSTREAM = "http://122.160.158.120:5072"
# Blocking CRM-managed users ON the device when they may not enter (api/_lib/enforce.ts):
# "dry" records what it would block/unblock and sends nothing; "on" only after the test at the gym
# with one test member (ACCESS_CONTROL.md §6); "off" stops it.
ADMS_ENFORCE_ACCESS = "dry"
# Workers can't hold a Firestore listener: the periodic command check is the fallback to the
# Open-door notify lane (see PHASE_3_PRODUCTION_READINESS.md)
ADMS_COMMAND_LISTEN = "0"
# TEMPORARY SAFETY SWITCH for X2008 testing: "0" = no CRM-generated command (Open door, add user,
# enrolment, user-list requests) is sent to the X2008; queued commands are left untouched and the
# old server's commands still pass through (api/iclock.ts). Remove this line only as an explicitly
# approved step — while it is set, CRM Open door / enrolment / sync do not reach the device.
ADMS_DELIVER_CRM_COMMANDS = "1"
# Regular look for queued commands (one read, shared by all instances, ≈ 5,800 reads a day).
# The "command queued" signal lives in one Cloudflare location's edge cache, so it is missed
# whenever staff's browser and the device reach different locations (e.g. a phone on mobile data).
# This look must then deliver Open door before its 30-second expiry: keep it at 15 s. 60 s made
# missed signals expire unsent (28 Oct).
ADMS_COMMAND_CHECK_MS = "15000"
# A big user list is mirrored 100 users per request (the rest on the next polls): keeps each
# request inside the free plan's 10 ms CPU. The device's answer never depends on it.
ADMS_USER_CHUNK = "100"
# Routine relay bookkeeping, kept inside Firestore's free tier: the device's "last seen" at most every
# 5 minutes (the CRM shows Online within 10), and the connection-diagnostics record every 30 minutes.
# Errors, device restarts and command results are still recorded at once.
ADMS_HEARTBEAT_MS = "300000"
ADMS_ROUTINE_RECORD_MS = "1800000"
# /poc/old-server-probe target (front page only)
PROBE_TARGET = "http://122.160.158.120:5072"
# Secrets (never in this file): FIREBASE_SERVICE_ACCOUNT (required), POC_PROBE_KEY (optional)
#   →  npx wrangler secret put <NAME>
# Never set FIRESTORE_EMULATOR_HOST / FIRESTORE_EMULATOR_URL / FIREBASE_AUTH_EMULATOR_HOST on a
# deployed Worker: with production credentials present the Worker refuses to serve (503).

# Final production hostname: explicitly approved cutover to the Worker.
[[routes]]
pattern = "www.crunnchhfitness.com"
custom_domain = true

# Open-door signal shared by every Cloudflare location (src/command-signal.ts): one small Durable
# Object per device. SQLite-backed, as the Workers Free plan requires.
[[durable_objects.bindings]]
name = "COMMAND_SIGNAL"
class_name = "CommandSignalObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommandSignalObject"]
